name: CI & Governance Verification

on:
  push:
    branches: [ main, "portfolio/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test_python_and_governance:
    name: Python Pipeline & Governance Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Test Suite (Engineering & Controls)
        run: |
          pytest tests/ -v --tb=short

      - name: Automated Governance Verification Check
        run: |
          python -c '
          with open("docs/governance/risk-register.md", "r") as f:
              content = f.read()
          lines = [line.strip() for line in content.splitlines() if line.startswith("| R-")]
          for line in lines:
              cols = [c.strip() for c in line.split("|") if c]
              if len(cols) >= 8:
                  status = cols[7]
                  evidence = cols[6]
                  if status.lower() == "treated" and (not evidence or evidence.lower() == "none" or evidence.lower() == "tbd"):
                      raise ValueError(f"Governance Failure: {cols[0]} is marked Treated but has no repo evidence!")
          print(f"Governance Check Passed: {len(lines)} risks evaluated with valid evidence verification.")
          '

  test_typescript_app:
    name: TypeScript / React / Express Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm install

      - name: Run TypeScript Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run TypeScript Citation Grounding & Pipeline Tests
        run: npx tsx scripts/verify_ts_controls.ts

      - name: Build Frontend & Express Server Bundle
        run: npm run build
